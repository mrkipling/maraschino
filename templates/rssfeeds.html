<div id="rssfeeds" class="module" data-module="rssfeeds">

  <div class="module_settings"><span>Settings</span></div>
  <div class="module_remove"><span>Remove</span></div>

  <h2>RSS Feeds</h2>

  {% if feed %}
    <ul>
      {% for entry in feed.entries %}
        <li>{{ entry.title }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
