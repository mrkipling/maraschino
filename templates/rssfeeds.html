<div id="rssfeeds" class="module" data-module="rssfeeds">

  <div class="module_settings"><span>Settings</span></div>
  <div class="module_remove"><span>Remove</span></div>

  <h2>RSS Feeds</h2>

    <select id="rss_site">
      <option>Select Site...</option>
        <option value="nzbmatrix" {% if site == 'nzbmatrix' %}selected{%endif%}>NZB Matrix</option>
        <option value="site2" {% if site == 'site2' %}selected{%endif%}>Site 2</option>
        <option value="site3" {% if site == 'site3' %}selected{%endif%}>Site 3</option>
    </select>
      {% if catagories|length %}
        <select id="rss_cat">
          {% for cat in catagories %}
            {% if cat.label|length %}
              <optgroup label="{{cat.label}}">
                {% for subcat in cat.value %}
                  <option value="{{  subcat.id  }}">{{subcat.name}}</option>
                {% endfor %}
              </optgroup>
            {% else %}
              <option value="{{cat.id}}">{{cat.name}}</option>
            {% endif %}
          {% endfor %}
        </select>
      {% endif %}

  <input type="text" id="rss_term" value="{% if term %}{{ term }}{% else %}Search{% endif %}" onfocus="if(this.value==this.defaultValue)this.value='';" onblur="if(this.value=='')this.value=this.defaultValue;"/>

  {% if feed %}
    <ul>
      {% for entry in feed.entries %}
        <li>{{ entry.title }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
