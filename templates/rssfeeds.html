<div id="rssfeeds" class="module" data-module="rssfeeds">

  <div class="module_settings"><span>Settings</span></div>
  <div class="module_remove"><span>Remove</span></div>

  <h2>RSS Feeds</h2>

    <select id="rss_site">
      <option  style="background: #2b3621; color:#fff">Select Site...</option>
        <option  style="background: #2b3621; color:#fff"value="nzbmatrix" {% if site == 'nzbmatrix' %}selected{%endif%}>NZB Matrix</option>
        <option  style="background: #2b3621; color:#fff"value="nzbsu" {% if site == 'newznab' %}selected{%endif%}>Newznab</option>        
    </select>
      {% if catagories|length %}
        <select id="rss_cat">
          {% for cat in catagories %}
            {% if cat.label|length %}
              <optgroup style="background: #2b3621; color:#fff" label="{{cat.label}}">
                {% for subcat in cat.value %}
                  <option style="background: #2b3621; color:#fff" value="{{  subcat.id  }}">{{subcat.name}}</option>
                {% endfor %}
              </optgroup>
            {% else %}
              <option style="background: #2b3621; color:#fff value="{{cat.id}}">{{cat.name}}</option>
            {% endif %}
          {% endfor %}
        </select>
      {% endif %}

  {% if feed %}
    <ul>
      {% for entry in feed.entries %}
        <li title="{{ entry.title }}" ><h1><a href="{{ entry.link }}" target="_blank">{{ entry.title|truncate(46, false) }}</a></h1>{{ entry.description }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
