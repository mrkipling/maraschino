<div id="newznab" class="module" data-module="newznab">
  <div class="module_settings"><span>Settings</span></div>
  <div class="module_remove"><span>Remove</span></div>

  <h2 class="title">{% block spotweb_title %}Newznab{% endblock %}</h2>

  <ul class="menu">
    <li class="search" title="Search"><span>Search</span></li>
    <li class="series" title="View Series"><span>Series</span></li>
    <li class="movies" title="View Movies"><span>Movies</span></li>
    <li class="home" title="Go Back"><span>Home</span></li>
  </ul>
  <div id="newz_search">
    <form method="" action="">
      <div class="formrow">
        <label for="id_query">Query</label>
        <input id="id_query" name="query" type="text" value="" />
      </div>
      <div class="choices">
        <div class="save">Search</div>
        <div class="cancel">Cancel</div>
      </div>
    </form>
  </div>
</div>
